name: Bug Report
description: Report an issue or broken behavior on the Kyro website
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue on **kyro.tonmoyinfrastructure.org**! Please provide as much context as possible.
  - type: input
    id: url
    attributes:
      label: Affected URL or Page
      description: The page URL where you observed the issue (e.g. `https://kyro.tonmoyinfrastructure.org/docs/security`).
      placeholder: https://kyro.tonmoyinfrastructure.org/...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser / Device
      options:
        - Chrome / Chromium
        - Firefox
        - Safari (macOS / iOS)
        - Edge
        - Mobile Browser
        - Other
    validations:
      required: true
